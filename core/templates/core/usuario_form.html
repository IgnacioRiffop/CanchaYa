{% extends 'core/base.html' %}
{% load static %}

{% block title %}Editar Usuario | CanchaYa{% endblock %}

{% block contenido %}
<div class="container py-5">
  <h1 class="h3 fw-bold mb-4">Editar usuario</h1>

  <div class="card shadow-sm p-4 rounded-4">
    <form method="post">
      {% csrf_token %}

      <div class="mb-3">
        <label class="form-label">Nombre</label>
        <input type="text"
               name="nombre"
               class="form-control"
               value="{{ usuario.nombre }}"
               required>
      </div>

      <div class="mb-3">
        <label class="form-label">Apellido</label>
        <input type="text"
               name="apellido"
               class="form-control"
               value="{{ usuario.apellido }}"
               required>
      </div>

      <div class="mb-3">
        <label class="form-label">Correo electrónico</label>
        <input type="email"
               name="email"
               class="form-control"
               value="{{ usuario.email }}"
               required>
      </div>

      <div class="mt-4 d-flex gap-2">
        <button type="submit" class="btn btn-success fw-semibold px-4">
          Guardar cambios
        </button>
        <a href="{% url 'crudUsuarios' %}" class="btn btn-outline-secondary px-4">
          Cancelar
        </a>
      </div>
    </form>
  </div>
</div>
{% endblock %}
